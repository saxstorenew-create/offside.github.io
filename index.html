<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Exploit Host - Offside Edition</title>
    <style>
        body {
            background-color: #12161f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 38px;
            margin-top: 30px;
            letter-spacing: 1px;
        }
        h3 {
            color: #a0aec0;
            font-weight: normal;
            margin-bottom: 40px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .btn {
            background-color: #1a202c;
            border: 2px solid #d69e2e;
            color: #ffffff;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover {
            background-color: #d69e2e;
            color: #1a202c;
            box-shadow: 0 0 15px rgba(214, 158, 46, 0.5);
        }
        .full-width {
            grid-column: span 3;
            max-width: 400px;
            margin: 10px auto 0 auto;
        }
        .footer {
            margin-top: 60px;
            color: #a0aec0;
            font-size: 14px;
        }
        .footer span {
            color: #d69e2e;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>PS4 Exploit Host - Offside Edition</h1>
    <h3>Welcome, saxstorenew-create!</h3>

    <div class="container">
        <a href="#" class="btn">GoldHEN Multi FW</a>

        <a href="#" class="btn">6.72 FW GoldHEN</a>
        <a href="#" class="btn">6.72 FW v3.0</a>
        <a href="#" class="btn">9.00 FW GoldHEN</a>
        <a href="#" class="btn">9.00 FW v3.0</a>
        <a href="#" class="btn full-width">Restore Host</a>
    </div>

    <div class="footer">
        <p>Powered by <span>Offside Project</span>. Firmware Cache Loaded.</p>
    </div>

</body>
</html>
